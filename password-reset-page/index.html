<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MoneyQuest</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 380px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, #34C759, #30B350);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
        }

        .logo-icon svg {
            width: 36px;
            height: 36px;
            fill: white;
        }

        .logo-text {
            font-size: 13px;
            font-weight: 500;
            color: #86868b;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #1d1d1f;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 17px;
            font-weight: 400;
            color: #86868b;
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #1d1d1f;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 16px 48px 16px 16px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 17px;
            font-family: inherit;
            color: #1d1d1f;
            background: #ffffff;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #86868b;
        }

        input:focus {
            outline: none;
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }

        .toggle-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #0071e3;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            padding: 4px;
        }

        .toggle-btn:hover {
            color: #0077ED;
        }

        .hint {
            font-size: 12px;
            color: #86868b;
            margin-top: 8px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px 24px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            margin-top: 24px;
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            background: #0077ED;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            background: #d2d2d7;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fff2f2;
            border: 1px solid #ffcdd2;
            color: #d32f2f;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 24px;
            display: none;
            text-align: center;
        }

        /* Success State */
        .success-state {
            text-align: center;
            display: none;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #34C759, #30B350);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .success-icon svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        .success-state h1 {
            margin-bottom: 12px;
        }

        .success-state p {
            font-size: 17px;
            color: #86868b;
            line-height: 1.6;
        }

        /* Invalid State */
        .invalid-state {
            text-align: center;
            display: none;
        }

        .invalid-icon {
            width: 80px;
            height: 80px;
            background: #f5f5f7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .invalid-icon svg {
            width: 40px;
            height: 40px;
            fill: #86868b;
        }

        .invalid-state p {
            font-size: 17px;
            color: #86868b;
            line-height: 1.6;
        }

        /* Animations */
        @keyframes scaleIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Invalid Token State -->
        <div class="invalid-state fade-in" id="invalidToken">
            <div class="invalid-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
            </div>
            <h1>Link Expired</h1>
            <p>This password reset link is no longer valid. Please request a new one from the app.</p>
        </div>

        <!-- Reset Form -->
        <div id="resetForm" class="fade-in">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                    </svg>
                </div>
                <div class="logo-text">MoneyQuest</div>
            </div>

            <h1>Reset your password</h1>
            <p class="subtitle">Create a new password for your account</p>

            <div class="error-message" id="errorMessage"></div>

            <form id="passwordForm">
                <div class="form-group">
                    <label for="password">New password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Enter new password" required minlength="8" autocomplete="new-password">
                        <button type="button" class="toggle-btn" onclick="togglePassword('password', this)">Show</button>
                    </div>
                    <p class="hint">At least 8 characters</p>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Enter password again" required autocomplete="new-password">
                        <button type="button" class="toggle-btn" onclick="togglePassword('confirmPassword', this)">Show</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Reset Password</button>
            </form>
        </div>

        <!-- Success State -->
        <div class="success-state" id="successMessage">
            <div class="success-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
            </div>
            <h1>You're all set</h1>
            <p>Your password has been reset successfully. Return to the app to sign in.</p>
        </div>
    </div>

    <script>
        // Initialize Appwrite
        const client = new Appwrite.Client();
        client
            .setEndpoint('https://fra.cloud.appwrite.io/v1') 
            .setProject('68cc8915002d8ab3a787'); 

        const account = new Appwrite.Account(client);

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const secret = urlParams.get('secret');

        // Check if we have valid parameters
        if (!userId || !secret) {
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('invalidToken').style.display = 'block';
        }

        // Toggle password visibility
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Hide';
            } else {
                input.type = 'password';
                btn.textContent = 'Show';
            }
        }

        // Handle form submission
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.style.display = 'none';

            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords don\'t match';
                errorDiv.style.display = 'block';
                return;
            }

            if (password.length < 8) {
                errorDiv.textContent = 'Password must be at least 8 characters';
                errorDiv.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>Resetting...';

            try {
                await account.updateRecovery(userId, secret, password);

                document.getElementById('resetForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';

            } catch (error) {
                console.error('Reset error:', error);
                
                let message = 'Something went wrong. Please try again.';
                if (error.code === 401) {
                    message = 'This link has expired. Please request a new one.';
                } else if (error.code === 400) {
                    message = 'Please choose a different password.';
                }

                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
