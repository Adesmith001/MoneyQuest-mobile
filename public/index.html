<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/logo-white.png" />
    <meta name="theme-color" content="#FF6B35" />
    <meta name="description" content="MoneyQuest — learn money skills through fun, bite-sized lessons." />
    <style id="hide-scrollbars">
      /* Hide scrollbars everywhere, but keep everything scrollable. */
      * {
        -ms-overflow-style: none; /* IE / legacy Edge */
        scrollbar-width: none; /* Firefox */
      }
      *::-webkit-scrollbar {
        display: none; /* Chrome, Safari, modern Edge */
        width: 0;
        height: 0;
      }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <div id="bootstrap-status" style="margin:auto;padding:24px;text-align:center;font:16px Arial,sans-serif;color:#333">
        <strong>Loading MoneyQuest…</strong>
        <p id="bootstrap-hint">Please wait a moment.</p>
        <button id="bootstrap-retry" type="button" style="display:none;padding:10px 18px;background:#ff5722;color:white;border:0;border-radius:8px;cursor:pointer" onclick="location.reload()">Retry</button>
      </div>
    </div>
    <script>
      setTimeout(function () {
        if (document.getElementById('bootstrap-status')) {
          document.getElementById('bootstrap-hint').textContent = 'The app is taking too long to start. Check your connection and retry.';
          document.getElementById('bootstrap-retry').style.display = 'inline-block';
        }
      }, 10000);
      // Retire the old cache-first worker. It could preserve HTML fallback
      // responses under image/font URLs after a deploy, leaving blank artwork.
      if ('serviceWorker' in navigator) {
        Promise.all([
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          }),
          'caches' in window
            ? caches.keys().then(function (keys) {
                return Promise.all(
                  keys
                    .filter(function (key) { return key.startsWith('moneyquest-'); })
                    .map(function (key) { return caches.delete(key); })
                );
              })
            : Promise.resolve(),
        ]).then(function () {
          var reloadKey = 'moneyquest-worker-retired';
          if (navigator.serviceWorker.controller && sessionStorage.getItem(reloadKey) !== '1') {
            sessionStorage.setItem(reloadKey, '1');
            location.reload();
          } else {
            sessionStorage.removeItem(reloadKey);
          }
        }).catch(function (err) {
          console.warn('Legacy service worker cleanup failed:', err);
        });
      }
    </script>
  </body>
</html>
